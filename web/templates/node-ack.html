<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="generator" content="PodNest">
        <meta name="author" content="Kevin Pirnie, iam@kevinpirnie.com">
        <meta name='copyright' content='Kevin Pirnie'>
        <meta name="referrer" content="no-referrer">
        <title>PodNest ~ Node Link</title>
        <link rel="stylesheet" href="/static/vendor/uikit/uikit.min.css">
        <link rel="stylesheet" href="/static/css/app.css">
        <link rel="stylesheet" href="/static/css/custom.css">
        <link rel="icon" type="image/svg+xml" sizes="16x16" href="/static/images/logo.svg">
        <link rel="icon" type="image/svg+xml" sizes="32x32" href="/static/images/logo.svg">
        <link rel="icon" type="image/svg+xml" sizes="48x48" href="/static/images/logo.svg">
        <link rel="icon" type="image/svg+xml" sizes="192x192" href="/static/images/logo.svg">
        <link rel="alternate icon" type="image/svg+xml" href="/static/images/logo.svg">
        <link rel="apple-touch-icon" sizes="180x180" href="/static/images/logo-192.png">
    </head>
    <body class="kp-login-body">

        <div class="uk-flex uk-flex-center uk-flex-middle kp-login-wrap">
            <div class="uk-card kp-card kp-login-card uk-width-1-1">

                <div class="uk-card-header uk-text-center">
                    <img src="/static/images/logo.svg" alt="PodNest" class="kp-logo-img-sm">
                    <h1 class="kp-brand-heading uk-margin-small-top">
                        <span class="kp-brand-pod">POD</span><span class="kp-brand-nest">NEST</span>
                    </h1>
                    <p class="kp-brand-tagline">NODE LINK</p>
                </div>

                <div class="uk-card-body">
                    <p id="kp-node-msg" class="uk-text-center kp-muted uk-margin-remove">
                        Confirming&hellip;
                    </p>
                    <div class="uk-margin-small-top uk-text-center">
                        <a href="/#nodes" class="kp-muted" style="font-size:0.85rem;">
                            &larr; Back to Nodes
                        </a>
                    </div>
                </div>

                <div class="uk-card-footer uk-text-center">
                    <p class="kp-card-footer-text">
                        Authorized access only!
                    </p>
                    <p class="kp-card-footer-text uk-margin-remove-bottom">Copyright &copy; {{currentYear}}, Kevin Pirnie. All Rights Reserved.</p>
                    <p class="kp-card-footer-text uk-margin-remove-top">
                        <a href="https://podnest.app/privacy-policy/" target="_blank">Privacy Policy</a> | 
                        <a href="https://podnest.app/support/" target="_blank">Getting Support</a> | 
                        <a href="https://kevinpirnie.com/" target="_blank">Shameless Plug</a>
                    </p>
                </div>

            </div>
        </div>

        <script src="/static/vendor/uikit/uikit.min.js" defer></script>
        <script src="/static/vendor/uikit/uikit-icons.min.js" defer></script>
        <script nonce="{{.Nonce}}">
            (function () {
                var msg = document.getElementById('kp-node-msg');
                var m = /[#&]ack=([^&]+)/.exec(window.location.hash);

                // drop the acknowledgement from the address bar and history before anything else
                history.replaceState(null, '', window.location.pathname);

                if (!m) {
                    msg.textContent = 'No acknowledgement was supplied.';
                    return;
                }

                fetch('/api/nodes/ack', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': {{.CSRFToken}} },
                    body: JSON.stringify({ ack: decodeURIComponent(m[1]) })
                }).then(function (r) {
                    return r.json().then(function (d) { return { ok: r.ok, d: d }; });
                }).then(function (res) {
                    if (res.ok) {
                        window.location.replace('/#nodes');
                        return;
                    }
                    msg.textContent = (res.d && res.d.error) || 'The acknowledgement could not be applied.';
                }).catch(function () {
                    msg.textContent = 'The acknowledgement could not be applied.';
                });
            })();
        </script>
    </body>
</html>
