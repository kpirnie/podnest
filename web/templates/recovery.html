<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Disaster Recovery | PodNest</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="kp-app-body">
    <main class="uk-container uk-container-small uk-margin-large-top">
        <section class="kp-card uk-padding">
            <h1 class="kp-view-title">Disaster Recovery</h1>
            <p id="recovery-status" role="status">Checking recovery progress…</p>
            <ul class="uk-list uk-list-divider" id="recovery-sites"></ul>
            <button id="resume-recovery" type="button" class="kp-btn-primary">Resume recovery</button>
            <a class="kp-btn-secondary" href="/logout">Sign out</a>
        </section>
    </main>
    <script nonce="{{.Nonce}}">
    (() => {
        const endpoint = "/api/disaster-recovery/restore";
        const button = document.getElementById("resume-recovery");
        const status = document.getElementById("recovery-status");
        const list = document.getElementById("recovery-sites");
        async function refresh() {
            try {
                const response = await fetch(endpoint);
                if (response.status === 401) return window.location.assign("/login");
                if (!response.ok) return;
                const data = await response.json();
                if (!data.active) return window.location.assign("/dashboard#disaster-recovery");
                button.disabled = data.busy;
                const remaining = data.sites.filter(site => ["pending", "running"].includes(site.state)).length;
                const current = data.sites.find(site => site.state === "running");
                status.textContent = (data.sites.length - remaining) + " attempted, " + remaining + " remaining" +
                    (current ? ". Current site: " + current.name : ".");
                list.replaceChildren(...data.sites.map(site => {
                    const row = document.createElement("li");
                    row.textContent = site.name + " — " + site.state + (site.error ? ": " + site.error : "");
                    return row;
                }));
            } catch {
                status.textContent = "Waiting for PodNest to become available…";
            }
        }
        button.addEventListener("click", async () => {
            button.disabled = true;
            try {
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: {"Content-Type": "application/json", "X-CSRF-Token": {{.CSRF}}},
                    body: "{}"
                });
                if (!response.ok) {
                    const data = await response.json();
                    status.textContent = data.error || "Recovery could not start.";
                }
            } catch {
                status.textContent = "The recovery request could not be sent.";
            } finally {
                refresh();
            }
        });
        refresh();
        setInterval(refresh, 4000);
    })();
    </script>
</body>
</html>
