<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PodNest ~ Two-Factor Authentication</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@latest/dist/css/uikit.min.css">
        <link rel="stylesheet" href="/static/css/app.css">
        <link rel="icon" type="image/svg+xml" href="https://cdn.kcp.im/logos/podnest.svg">
        <link rel="alternate icon" type="image/svg+xml" href="https://cdn.kcp.im/logos/podnest.svg">
        <link rel="apple-touch-icon" href="https://cdn.kcp.im/logos/podnest.svg">
    </head>
    <body class="kp-login-body">

        <div class="uk-flex uk-flex-center uk-flex-middle kp-login-wrap">
            <div class="uk-card kp-card kp-login-card uk-width-1-1">

                <div class="uk-card-header uk-text-center">
                    <img src="https://cdn.kcp.im/logos/podnest.svg" alt="PodNest" class="kp-logo-img-sm">
                    <h1 class="kp-brand-heading uk-margin-small-top">
                        <span class="kp-brand-pod">POD</span><span class="kp-brand-nest">NEST</span>
                    </h1>
                    <p class="kp-brand-tagline">TWO-FACTOR AUTHENTICATION</p>
                </div>

                <div class="uk-card-body">
                    {{if .Error}}
                    <div class="kp-alert-error uk-margin-bottom">
                        <span uk-icon="icon: warning; ratio: 0.85"></span>
                        &nbsp;{{.Error}}
                    </div>
                    {{end}}

                    <p class="uk-text-center kp-muted uk-margin-bottom">
                        Enter the 6-digit code from your authenticator app, or a backup code.
                    </p>

                    <form method="POST" action="/login/totp" class="uk-form-stacked">
                        <div class="uk-margin">
                            <label class="kp-label" for="code">Verification Code</label>
                            <div class="uk-inline uk-width-1-1">
                                <span class="uk-form-icon" uk-icon="lock"></span>
                                <input
                                    class="uk-input kp-input"
                                    id="code"
                                    name="code"
                                    type="text"
                                    inputmode="text"
                                    maxlength="9"
                                    placeholder="000000 or XXXX-XXXX"
                                    autocomplete="one-time-code"
                                    autofocus
                                    required
                                    style="padding-left:40px !important; letter-spacing:0.2em; font-size:1.2rem; text-align:center"
                                >
                            </div>
                        </div>

                        <div class="uk-margin-top">
                            <button class="uk-button kp-btn-primary uk-width-1-1" type="submit" style="justify-content:center;height:48px">
                                <span uk-icon="check"></span>
                                Verify
                            </button>
                        </div>
                        <div class="uk-margin-small-top uk-text-center">
                            <a href="/login" class="kp-muted" style="font-size:0.85rem;">
                                &larr; Back to login
                            </a>
                        </div>
                    </form>
                </div>

                <div class="uk-card-footer uk-text-center">
                    <p class="kp-card-footer-text">
                        Authorized access only!
                    </p>
                    <p class="kp-card-footer-text uk-margin-remove-bottom">Copyright &copy; {{currentYear}}, Kevin Pirnie. All Rights Reserved.</p>
                </div>

            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/uikit@latest/dist/js/uikit.min.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/uikit@latest/dist/js/uikit-icons.min.js" defer></script>
    </body>
</html>
